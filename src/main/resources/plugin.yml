name: Linked
version: "${version}"
main: uk.vrtxx.linked.Linked
api-version: "${minecraftVersion}"
author: TutorialMan7727
description: A global linking plugin
commands:
  linked:
    description: Manage Linked features.
    usage: /linked <inventory|health|effect|death|progress|respawn|insomnia> <enable|disable|status>
    aliases: [link]
    permission: linked.admin
permissions:
  linked.admin:
    description: Allows management of Linked features.
    default: op
