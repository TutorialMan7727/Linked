name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Derive plugin version from tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must be a version such as v1.2.3 or 1.2.3."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release JAR
        run: ./gradlew build --no-daemon -PpluginVersion="${{ steps.version.outputs.value }}"

      - name: Upload release workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: linked-${{ steps.version.outputs.value }}
          path: build/libs/linked-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "build/libs/linked-${{ steps.version.outputs.value }}.jar"
          --title "Linked ${{ steps.version.outputs.value }}"
          --generate-notes
